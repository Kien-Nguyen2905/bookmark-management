basePath: /
definitions:
  handler.shortenLinkInput:
    properties:
      exp:
        description: Exp is the lifetime of the link in seconds.
        example: 604800
        type: integer
      url:
        example: https://example.com
        type: string
    required:
    - exp
    - url
    type: object
  model.HealthCheckResponse:
    properties:
      instance_id:
        example: 18cf5eaf-f401-45bf-a827-265b9c6c9333
        type: string
      message:
        example: OK
        type: string
      service_name:
        example: bookmark_service
        type: string
    type: object
info:
  contact: {}
  description: A simple link shortening API
  title: Bookmark Management API
  version: 1.0.0
paths:
  /health-check:
    get:
      description: Check the service and its connection to Redis
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthCheckResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /v1/links/shorten:
    post:
      consumes:
      - application/json
      description: Generate a 7-character code for the url and store it in Redis for
        exp seconds
      parameters:
      - description: Input required
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.shortenLinkInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Shorten a link
      tags:
      - link
swagger: "2.0"
